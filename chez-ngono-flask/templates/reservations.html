{% extends "base.html" %}
{% block titre %}Réservations{% endblock %}

{% block contenu %}
<h2>Réservations ({{ reservations|length }})</h2>
<table>
    <tr><th>Date</th><th>Service</th><th>Nom</th><th>Personnes</th><th></th></tr>
    {% for r in reservations %}
    <tr>
        <td>{{ r.date }}</td><td>{{ r.service }}</td><td>{{ r.nom }}</td><td>{{ r.personnes }}</td>
        <td>
            <form method="post" action="{{ url_for('annuler', id_resa=r.id) }}">
                <button type="submit">Annuler</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
